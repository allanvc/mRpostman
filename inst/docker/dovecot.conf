# Minimal Dovecot configuration for the mRpostman IMAP sandbox.
#
# NOT suitable for production use: no TLS, plaintext authentication, and a
# single static password shared by every user. The server is meant to run
# locally, inside a disposable container, for testing and demonstration only.

protocols = imap
listen = *

log_path = /dev/stderr
info_log_path = /dev/stdout

ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

# any username authenticates with the password "sandbox"
passdb {
  driver = static
  args = password=sandbox
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/srv/mail/%u
}

mail_location = maildir:~/Maildir

# the vmail system user created in the Dockerfile has a uid below Dovecot's
# default threshold of 500
first_valid_uid = 100

namespace inbox {
  inbox = yes
  # special-use folders (RFC 6154), created automatically
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}

# optional extensions exercised by mRpostman: ACL (RFC 4314) and QUOTA (RFC 2087)
mail_plugins = acl quota

protocol imap {
  mail_plugins = $mail_plugins imap_acl imap_quota
}

plugin {
  acl = vfile
  acl_anyone = allow
  quota = maildir:User quota
  quota_rule = *:storage=1G
}
